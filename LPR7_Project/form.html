<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Загадки истории — древние цивилизации и тайны</title>

    <meta name="description" content="Откройте тайны древних цивилизаций, исследуйте историю Египта, Майя и других народов, их культуру, архитектуру и загадочные открытия.">

    <meta name="keywords" content="история, древние цивилизации, Египет, Майя, археология, пирамиды, древний мир, исторические тайны">

    <meta name="author" content="Асанали Куандыков">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#101827">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">MYSTERY<span>HISTORY</span></a>
    <nav class="navigation">
        <a href="index.html">Главная</a>
        <a href="gallery.html">Галерея</a>
        <a href="form.html" class="active">Анкета</a>
    </nav>
</header>

<main class="page-container">
    <div class="section-heading">
        <p class="subtitle">СТАНЬ ЧАСТЬЮ ИСТОРИИ</p>
        <h1>Регистрация и анкета</h1>
        <p>Расскажи немного о себе и своих интересах.</p>
    </div>

    <form id="registration" class="form-card" novalidate>
        <h2>Создание аккаунта</h2>

        <div class="form-grid">
            <div class="form-group">
                <label for="name">Имя *</label>
                <input type="text" id="name" placeholder="Введите имя" required>
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label for="surname">Фамилия *</label>
                <input type="text" id="surname" placeholder="Введите фамилию" required>
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label for="email">Электронная почта *</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" placeholder="+7 777 123 45 67">
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label for="password">Пароль *</label>
                <input type="password" id="password" placeholder="Минимум 8 символов" required>
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Повторите пароль *</label>
                <input type="password" id="confirmPassword" placeholder="Повторите пароль" required>
                <small class="error"></small>
            </div>

            <div class="form-group full-width">
                <label for="birthdate">Дата рождения *</label>
                <input type="date" id="birthdate" required>
                <small class="error"></small>
            </div>

            <div class="form-group full-width">
                <label class="checkbox-label">
                    <input type="checkbox" id="agreement" required>
                    Я согласен на обработку введённых данных *
                </label>
                <small class="error"></small>
            </div>
        </div>

        <div class="divider"></div>

        <h2>Историческая анкета</h2>

        <div class="form-grid">
            <div class="form-group">
                <label for="era">Любимая эпоха *</label>
                <select id="era" required>
                    <option value="">Выберите эпоху</option>
                    <option>Древний мир</option>
                    <option>Средневековье</option>
                    <option>Эпоха Возрождения</option>
                    <option>Новое время</option>
                </select>
                <small class="error"></small>
            </div>

            <div class="form-group">
                <label for="civilization">Любимая цивилизация *</label>
                <select id="civilization" required>
                    <option value="">Выберите цивилизацию</option>
                    <option>Древний Египет</option>
                    <option>Древний Рим</option>
                    <option>Древняя Греция</option>
                    <option>Майя</option>
                    <option>Шумеры</option>
                    <option>Инки</option>
                </select>
                <small class="error"></small>
            </div>

            <div class="form-group full-width">
                <label>Какая историческая загадка интересует больше всего? *</label>

                <label class="radio-label">
                    <input type="radio" name="mystery" value="Атлантида" required>
                    Атлантида
                </label>

                <label class="radio-label">
                    <input type="radio" name="mystery" value="Египетские пирамиды">
                    Египетские пирамиды
                </label>

                <label class="radio-label">
                    <input type="radio" name="mystery" value="Исчезновение цивилизаций">
                    Исчезновение цивилизаций
                </label>

                <label class="radio-label">
                    <input type="radio" name="mystery" value="Древние артефакты">
                    Древние артефакты
                </label>

                <small class="error"></small>
            </div>

            <div class="form-group full-width">
                <label for="about">Почему тебе интересна история?</label>
                <textarea id="about" rows="4" placeholder="Напиши несколько предложений..."></textarea>
            </div>
        </div>

        <button type="submit" class="main-button">Отправить анкету</button>
    </form>

    <div id="success" class="success-card" hidden>
        <h2>Анкета успешно отправлена!</h2>
        <p>Спасибо за интерес к истории. Добро пожаловать в MYSTERY HISTORY!</p>
        <div id="userInfo"></div>
        <a href="index.html" class="main-button">На главную</a>
    </div>
</main>

<footer class="footer">
    <p>© 2026 MYSTERY HISTORY</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
